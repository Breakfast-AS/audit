# Kunder som inngår i den månedlige SEO-auditen.
# slug       = mappenavn under clients/
# key_pages  = stier som får Lighthouse/PageSpeed-måling (mobil). Hold det til 2–4 per kunde.
# event_patterns (valgfritt) = deler av URL/sitemapnavn som markerer arrangementssider (Event-schema-dekning).
# max_pages  (valgfritt) = crawl-tak, standard 500. Over taket tas et proporsjonalt utvalg per undersitemap.

[[client]]
slug = "moss"
name = "Moss kulturhus"
url = "https://www.mosskulturhus.no/"
key_pages = ["/", "/program/"]
event_patterns = ["/event/"]

